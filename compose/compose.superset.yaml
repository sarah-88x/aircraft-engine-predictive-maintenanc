services:
  superset:
    image: apache/superset:3.1.0
    container_name: aircraft-superset
    restart: unless-stopped
    ports:
      - "127.0.0.1:8088:8088"
    environment:
      SUPERSET_SECRET_KEY: "aircraft_secret_key_predictive_maintenance"
    networks:
      - bigdata

networks:
  bigdata:
    external: true
    name: compose_default