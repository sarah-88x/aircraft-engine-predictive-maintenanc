services:
  clickhouse:
    image: clickhouse/clickhouse-server:26.9.19.9
    container_name: aircraft-clickhouse
    restart: unless-stopped

    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"

    ulimits:
      nofile:
        soft: 262144
        hard: 262144

    ports:
      - "127.0.0.1:8123:8123"
      - "127.0.0.1:9000:9000"

    volumes:
      - aircraft_clickhouse_data:/var/lib/clickhouse
      - aircraft_clickhouse_logs:/var/log/clickhouse-server

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "clickhouse-client --user $${CLICKHOUSE_USER} --password $${CLICKHOUSE_PASSWORD} --query 'SELECT 1' >/dev/null 2>&1"
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  aircraft_clickhouse_data:
    name: aircraft_clickhouse_data

  aircraft_clickhouse_logs:
    name: aircraft_clickhouse_logs
