services:
  namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    container_name: aircraft-hdfs-namenode
    hostname: namenode
    restart: unless-stopped

    environment:
      CLUSTER_NAME: aircraft-hdfs
      CORE_CONF_fs_defaultFS: hdfs://namenode:9000
      CORE_CONF_hadoop_http_staticuser_user: root
      HDFS_CONF_dfs_webhdfs_enabled: "true"
      HDFS_CONF_dfs_permissions_enabled: "false"
      HDFS_CONF_dfs_replication: "1"
      HDFS_CONF_dfs_namenode_name_dir: file:///hadoop/dfs/name

    ports:
      - "127.0.0.1:9001:9000"
      - "127.0.0.1:9871:9870"

    volumes:
      - aircraft_hdfs_namenode_data:/hadoop/dfs/name
      - ../data/processed:/data/processed:ro

    networks:
      - bigdata

    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9870/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  datanode:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: aircraft-hdfs-datanode
    hostname: datanode
    restart: unless-stopped

    depends_on:
      - namenode

    environment:
      SERVICE_PRECONDITION: "namenode:9870"
      CORE_CONF_fs_defaultFS: hdfs://namenode:9000
      CORE_CONF_hadoop_http_staticuser_user: root
      HDFS_CONF_dfs_permissions_enabled: "false"
      HDFS_CONF_dfs_replication: "1"
      HDFS_CONF_dfs_datanode_data_dir: file:///hadoop/dfs/data

    ports:
      - "127.0.0.1:9865:9864"

    volumes:
      - aircraft_hdfs_datanode_data:/hadoop/dfs/data

    networks:
      - bigdata

networks:
  bigdata:
    external: true
    name: compose_default

volumes:
  aircraft_hdfs_namenode_data:
    name: aircraft_hdfs_namenode_data

  aircraft_hdfs_datanode_data:
    name: aircraft_hdfs_datanode_data