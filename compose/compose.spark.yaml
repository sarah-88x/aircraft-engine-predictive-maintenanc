services:
  spark-master:
    image: apache/spark:4.1.3-python3
    container_name: aircraft-spark-master
    hostname: spark-master
    restart: unless-stopped

    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.master.Master
      - --host
      - spark-master
      - --port
      - "7077"
      - --webui-port
      - "8080"

    ports:
      - "127.0.0.1:7077:7077"
      - "127.0.0.1:8080:8080"


    environment:
      PYTHONPATH: /opt/pylibs
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}

    volumes:
      - ../scripts:/app/scripts:ro
      - ../pylibs:/opt/pylibs:ro
      - ../data/processed:/app/data/processed:ro
      - ../jars/spark-sql-kafka-0-10_2.13-4.1.3.jar:/opt/spark/jars/spark-sql-kafka-0-10_2.13-4.1.3.jar:ro
      - ../jars/spark-token-provider-kafka-0-10_2.13-4.1.3.jar:/opt/spark/jars/spark-token-provider-kafka-0-10_2.13-4.1.3.jar:ro
      - ../jars/kafka-clients-3.9.1.jar:/opt/spark/jars/kafka-clients-3.9.1.jar:ro
      - ../jars/commons-pool2-2.12.1.jar:/opt/spark/jars/commons-pool2-2.12.1.jar:ro
    networks:
      - bigdata

  spark-worker:
    image: apache/spark:4.1.3-python3
    container_name: aircraft-spark-worker
    hostname: spark-worker
    restart: unless-stopped

    depends_on:
      - spark-master

    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.worker.Worker
      - spark://spark-master:7077
      - --cores
      - "2"
      - --memory
      - 1G
      - --webui-port
      - "8081"

    ports:
      - "127.0.0.1:8081:8081"


    environment:
      PYTHONPATH: /opt/pylibs
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}

    volumes:
      - ../scripts:/app/scripts:ro
      - ../pylibs:/opt/pylibs:ro
      - ../data/processed:/app/data/processed:ro
      - ../jars/spark-sql-kafka-0-10_2.13-4.1.3.jar:/opt/spark/jars/spark-sql-kafka-0-10_2.13-4.1.3.jar:ro
      - ../jars/spark-token-provider-kafka-0-10_2.13-4.1.3.jar:/opt/spark/jars/spark-token-provider-kafka-0-10_2.13-4.1.3.jar:ro
      - ../jars/kafka-clients-3.9.1.jar:/opt/spark/jars/kafka-clients-3.9.1.jar:ro
      - ../jars/commons-pool2-2.12.1.jar:/opt/spark/jars/commons-pool2-2.12.1.jar:ro
    networks:
      - bigdata

networks:
  bigdata:
    external: true
    name: compose_default
